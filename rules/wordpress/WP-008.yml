id: WP-008
platform: wordpress
cwe: 601
severity: medium
summary: wp_redirect() to a URL from request data
source: ['$_GET', '$_POST', '$_REQUEST', '$_COOKIE',
         '->get_param', '->get_params', '->get_json_params', '->get_body_params', '->get_query_params']
sanitizers: [wp_validate_redirect, admin_url, home_url, site_url, network_admin_url, network_home_url,
             get_admin_url, get_home_url, get_permalink, wp_login_url]
sink: wp_redirect_location
precision_notes: >
  A nonce verified in the same function makes the finding weak: the attacker cannot build a working
  link without a valid nonce.
  Request input → (assignments, concatenation, `??`, passthrough functions) → the first argument of
  wp_redirect() within one scope. esc_url / esc_url_raw / wp_sanitize_redirect pass the taint
  through: they clean characters, not the host. add_query_arg / remove_query_arg carry only the taint
  of their base-URL argument; without one they redirect to the current host. URLs built on
  admin_url() / home_url() etc. or checked with wp_validate_redirect() are safe. Silent on parameters
  and unknown functions. header('Location: ...') is not covered in v0.1. Redirecting back to the
  HTTP referer is not reported (low value, needs the victim to arrive from the attacker's page).
params:
  # A nonce verified in the same function: a crafted link alone cannot trigger it → weak.
  nonce_checks: [wp_verify_nonce, check_admin_referer, check_ajax_referer, "*verify_nonce*", "->*verify_nonce*"]
  guard_functions: [in_array, array_key_exists, is_numeric, ctype_digit, ctype_alnum]
  terminators: [wp_die, wp_send_json, wp_send_json_error, wp_send_json_success]
  sink_functions: [wp_redirect]
  query_arg_functions: [add_query_arg, remove_query_arg]
  format_functions: [sprintf]
  passthrough: [wp_unslash, stripslashes, trim, urldecode, rawurldecode, html_entity_decode, base64_decode,
                sanitize_text_field, esc_url, esc_url_raw, sanitize_url, wp_sanitize_redirect, str_replace]
references:
  - cve: CVE-2021-25028
    fix_commit: https://plugins.trac.wordpress.org/changeset?old_path=/event-tickets/tags/5.2.1&new_path=/event-tickets/tags/5.2.2
    corpus: WP-008/case-01
  - cve: CVE-2026-1296
    fix_commit: https://plugins.trac.wordpress.org/changeset?old_path=/frontend-post-submission-manager-lite/tags/1.2.7&new_path=/frontend-post-submission-manager-lite/tags/1.2.8
    corpus: WP-008/case-02
plugin:
  description_html: inspectionDescriptions/WP008UnsafeRedirect.html
  quick_fix: use_wp_safe_redirect
