---
# DRAFT 2026-11-02 — first Joomla rule. Mirrors WP-005 (reuses SqlInjectionCheck, which is
# rule-param-driven via `receivers`/`sink_methods`). NOT yet validated: needs a real-CVE corpus
# (fixtures from the extensions below) + FP run before it leaves draft, per the linter DoD.
# Engine prerequisites (separate stage): add "joomla" to RuleParser.SUPPORTED_PLATFORMS, register
# "JL-005" -> ::SqlInjectionCheck in Checks.kt, and make the SqlInjectionCheck finding message
# use the receiver name (it currently hardcodes "$wpdb->...").
id: JL-005
platform: joomla
cwe: 89
severity: critical
summary: SQL built from request input reaches $db->setQuery() without $db->quote()/escape() or an integer cast
# Joomla request-input readers. getInt/getUint/getFloat are casts (safe) -> listed under sanitizers,
# NOT here. The dangerous readers return strings/raw/arrays.
# Bare `->get()` is Joomla's dominant SQLi source but is shared with Registry/params `->get()` — so it
# is expressed as a RECEIVER-QUALIFIED source (`$input->get`/`$jinput->get`): the engine matches `->get`
# only when the receiver's variable or property name is `input`/`jinput`, which also covers the chained
# `$app->input->get` / `$this->input->get` (property named `input`). The SPECIFIC JInput getters stay
# receiver-agnostic (low collision). Still not expressible: static `JRequest::getVar` (legacy `::`).
source: ['$_GET', '$_POST', '$_REQUEST', '$_COOKIE', '$_SERVER[REQUEST_URI]', '$_SERVER[QUERY_STRING]',
         '$_SERVER[HTTP_*]',
         '$input->get', '$jinput->get',
         '->getString', '->getRaw', '->getArray', '->getCmd', '->getHtml', '->getBase64',
         '->getVar', '->getWord', '->getUsername', '->getPath']
# $db->quote()/escape() and integer casts are the real SQL-safe sinks in Joomla. getInt/getUint/
# getFloat return ints. JFilterInput::clean with a numeric/cmd filter is safe; with 'string'/'raw' it is NOT.
sanitizers: [intval, absint, floatval, '->getInt', '->getUint', '->getFloat',
             '->quote', '->q', '->escape', '->e', '->quoteName', '->qn']
sink: joomla_db_setquery
precision_notes: >
  Intra-procedural taint (core/flow): Joomla request input -> assignments, `.=`, concatenation,
  interpolation, array reads/writes, foreach, `??`, passthrough functions -> the first argument of
  $db->setQuery() (or a direct $db->query()/$db->q() with an inline SQL string). The canonical Joomla
  pattern is two-step: `$query = "... $tainted ..."; $db->setQuery($query); $db->loadResult();` — the
  injection point is the string handed to setQuery(), so loadResult/loadObjectList/loadColumn are the
  execution, not the sink. $db->quote()/$db->escape()/$db->quoteName() and (int) casts make a value
  SQL-safe; ->getInt/->getUint/->getFloat return integers (safe). ->getString/->getRaw/->getCmd pass
  the raw value through (getCmd strips to [A-Za-z0-9_.-] — still allows SQL in some contexts, so it is
  a SOURCE, not a sanitizer). trim/strtolower/implode/str_replace pass the taint through. Silent when
  the value is cast, quoted/escaped, checked by an allow-list guard (in_array/ctype_digit), or comes
  from a property/unknown function (not proven). Known misses (same as WP-005): input read as an array
  then a tainted element used; flows through helper methods; second-order (value stored, re-read from DB).
params:
  # Joomla authorization/CSRF. A check in the same function makes a finding weak (privileged-only reach).
  admin_checks: ['->authorise', 'authorise', '->checkToken', 'checkToken']
  guard_functions: [in_array, array_key_exists, is_numeric, ctype_digit, ctype_alnum]
  terminators: [jexit, 'die', 'exit']
  receivers: [db, dbo, _db]
  sink_methods: [setquery, query, q]
  format_functions: [sprintf]
  passthrough: [trim, ltrim, rtrim, strtolower, strtoupper, implode, join, str_replace, substr,
                urldecode, rawurldecode, html_entity_decode, base64_decode, json_decode, stripslashes]
# Real-CVE anchors to build the corpus from (vulnerable + fixed source per case). All 2026, CWE-89,
# most UNAUTHENTICATED — the dominant Joomla extension class.
# NOTE: fix_commit currently points to the authoritative advisory (vendor fix commits for these
# vendor-hosted extensions are not public); replace with the real fix ref when the corpus is fetched.
references:
  - cve: CVE-2026-57832   # EDocman (JoomDonation) — unauth SQLi
    fix_commit: https://nvd.nist.gov/vuln/detail/CVE-2026-57832
    corpus: JL-005/case-01
  - cve: CVE-2026-49048   # JoomCCK (JoomCoder) — unauth SQLi, < 6.4.1
    fix_commit: https://nvd.nist.gov/vuln/detail/CVE-2026-49048
    corpus: JL-005/case-02
  - cve: CVE-2026-74804   # Zoo (YOOtheme) — unauth SQLi, ItemController::element(), < 4.1.64
    fix_commit: https://nvd.nist.gov/vuln/detail/CVE-2026-74804
    corpus: JL-005/case-03
  - cve: CVE-2026-65766   # SP Page Builder — SQLi 9.2
    fix_commit: https://nvd.nist.gov/vuln/detail/CVE-2026-65766
    corpus: JL-005/case-04
plugin:
  description_html: inspectionDescriptions/JL005UnpreparedSql.html
  quick_fix: none
